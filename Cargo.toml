[package]
name = "shaled"
version = "0.1.0"
edition = "2021"
authors = ["Arc Riley <arcriley@gmail.com>"]
license = "AGPL-3.0-or-later"
description = "A layer-streaming tensor engine"
repository = "https://github.com/arcriley/shaled"
homepage = "https://github.com/arcriley/shaled"
documentation = "https://docs.rs/shaled"
readme = "README.md"
keywords = ["llm", "quantization", "tensor", "int4"]
categories = ["science", "hardware-support"]

[lib]
name = "shaled"
path = "src/lib.rs"
crate-type = ["lib", "staticlib"]

[dependencies]
# Zero-copy memory mapping
memmap2 = "0.9"

# Error handling
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"